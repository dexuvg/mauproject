<body>

    <div class="parent-container">
        <div class="quiz-container">
            <p class="question-text">
            В правильной треугольной пирамиде SABC (с вершиной S) сторона основания равна 2√3, а боковое ребро равно 3. Найдите расстояние от точки C до плоскости ABS.
            </p>
            <nav>
                <img src="logo_mau.png">
                <ul>
                    <li class="nav-item">
                        <a href="index.html">Главная страница</a>
                    </li>
                    <li class="nav-item">
                        <a href="catalogpage.html">Каталог задач</a>
                    </li>
                </ul>
            </nav>
            <div class="options" id="options-list">
                <label data-value="a">
                    <input type="checkbox" name="q1" value="a">
                    <p>$$\frac{\sqrt11} {3}$$</p>
                    <span class="feedback-icon"></span>
                </label>
                <label data-value="b">
                    <input type="checkbox" name="q1" value="b">
                    $$11$$ <span class="feedback-icon"></span>
                </label>
                <label data-value="c">
                    <input type="checkbox" name="q1" value="c">
                    $$\sqrt\frac{15}{2}$$ <span class="feedback-icon"></span>
                </label>
                <label data-value="d">
                    <input type="checkbox" name="q1" value="d">
                    $$\frac{\sqrt7}{19}$$<span class="feedback-icon"></span>
                </label>

                <span id="result-text"></span>
                <button id="show-solution-btn" style="display: none;"><a>Посмотреть решение</a></button>
            </div>
            <div class="solution-text" id="solution-text">
                Правильный ответ — $$\sqrt\frac{15}{2}$$.
            </div>
